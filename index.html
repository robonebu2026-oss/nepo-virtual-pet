<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nébula</title>
<style>
:root{
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
 --eye:#f7d9e4;
 --ew:min(24vw,36vh)
}
html,body{
 height:100%;margin:0;background:#000;color:#eee;
 font-family:system-ui,sans-serif;overflow:hidden;
 touch-action:none;user-select:none;-webkit-user-select:none
}
.fallFX{animation:fallWob .32s ease-in-out 0s 3}
@keyframes fallWob{
 0%{transform:rotate(0) translateY(0)}
 30%{transform:rotate(-9deg) translateY(10px)}
 60%{transform:rotate(8deg) translateY(18px)}
 100%{transform:rotate(0) translateY(0)}
}
.memoryCard{
 padding:10px;border:1px solid #ffffff16;border-radius:14px;
 background:#ffffff08;margin:7px 0;text-align:left
}
.memoryCard small{opacity:.55}
.rarityCommon{opacity:.82}
.rarityUncommon{color:#bfe8c6}
.rarityRare{color:#a8c7ff}
.rarityEpic{color:#d8b5ff}
.rarityMythic{color:#ffd98a}

#screen{
 position:fixed;inset:0;display:flex;
 align-items:center;justify-content:center
}
#face{
 position:relative;display:flex;flex-direction:column;
 align-items:center;gap:calc(var(--ew)*.22)
}
#eyes{
 position:relative;display:flex;gap:14%;
 transition:transform .25s
}
#mouth{
 height:calc(var(--ew)*.4);
 display:flex;justify-content:center
}
#mouth::before{content:"";display:none}

body[data-m=happy] #mouth::before,
body[data-m=carinho] #mouth::before{
 display:block;width:calc(var(--ew)*.5);
 height:calc(var(--ew)*.2);
 border-bottom:5px solid var(--eye);
 border-radius:0 0 50% 50%
}

body[data-m=angry] #mouth::before{
 display:block;width:calc(var(--ew)*.18);
 height:calc(var(--ew)*.18);
 border-left:5px solid #ffb3b3;
 border-top:5px solid #ffb3b3;
 transform:rotate(45deg);margin-top:8px
}
body[data-m=sad] #mouth::before{
 display:block;width:calc(var(--ew)*.3);
 height:calc(var(--ew)*.14);
 border-top:5px solid
